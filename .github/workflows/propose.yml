name: Propose daily post

# Times are UTC. GitHub cron does not follow daylight saving, so the US
# Eastern alignment drifts by an hour between summer and winter.
on:
  schedule:
    # 13:07 UTC is 9am US Eastern, the strongest slot in Buffer's 9.6M-post
    # study, and 9pm in Ulaanbaatar so Enguun is awake to approve it.
    # GitHub drops most scheduled runs, so try four times; a once-per-day
    # guard in propose.js means only the first that fires produces a post.
    - cron: '7 13 * * *'
    - cron: '11 14 * * *'
    - cron: '19 15 * * *'
    - cron: '23 16 * * *'
  workflow_dispatch:

concurrency:
  group: hamster-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  propose:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_BRANCH: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generate episode and ask for approval
        run: node src/propose.js

      # if: always() matters. propose.js has already sent the proposal to
      # Telegram by this point and stamped lastProposedOn; if this step is
      # skipped the claim never reaches the remote and the next cron slot
      # generates and sends a SECOND proposal for the same day.
      - name: Persist the proposal
        if: always()
        run: .github/workflows/_persist.sh "Propose post $(date -u +%Y-%m-%d)"

      # The image is live on raw.githubusercontent.com now, so an immediate
      # approval can publish right away instead of waiting for the next check.
      - name: Wait briefly for a fast answer
        run: node src/check.js --wait 10

      - name: Persist the result
        if: always()
        run: .github/workflows/_persist.sh "Update after approval check"

      - name: Alert if state could not be saved
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="The daily propose run failed. Check the Actions tab: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
