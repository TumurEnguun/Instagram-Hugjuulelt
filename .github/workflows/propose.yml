name: Propose daily post

# 01:00 UTC = 09:00 in Ulaanbaatar (UTC+8).
# GitHub cron is always UTC and does not follow daylight saving.
on:
  schedule:
    # GitHub drops most scheduled runs, so try several times across the
    # Ulaanbaatar morning. A once-per-day guard in propose.js means only the
    # first slot that actually fires produces a post.
    - cron: '17 1 * * *'
    - cron: '23 2 * * *'
    - cron: '31 3 * * *'
    - cron: '43 4 * * *'
  workflow_dispatch:

concurrency:
  group: hamster-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  propose:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_BRANCH: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generate episode and ask for approval
        run: node src/propose.js

      - name: Commit the proposed image
        run: |
          git config user.name "hamster-bot"
          git config user.email "hamster-bot@users.noreply.github.com"
          git add -A posts pending.json story-state.json
          git diff --staged --quiet || git commit -m "Propose post $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_BRANCH}"
          git push origin HEAD:"${GITHUB_BRANCH}"

      # The image is live on raw.githubusercontent.com now, so an immediate
      # approval can publish right away instead of waiting for the next check.
      - name: Wait briefly for a fast answer
        run: node src/check.js --wait 10

      - name: Commit the result
        if: always()
        run: |
          git add -A posts pending.json story-state.json
          git diff --staged --quiet || git commit -m "Update after approval check"
          git pull --rebase --autostash origin "${GITHUB_BRANCH}"
          git push origin HEAD:"${GITHUB_BRANCH}"
