name: Propose daily post

# Times are UTC. GitHub cron does not follow daylight saving, so the US
# Eastern alignment drifts by an hour between summer and winter.
on:
  schedule:
    # 16:07 UTC lands 9am in Monterey (Enguun is awake to approve), noon in
    # New York and 5pm in London, so it is a strong slot for a US and UK
    # audience AND a time he can actually act on. The earlier 13:07 slot was
    # 6:07am Pacific, so proposals sat unapproved through their own peak.
    # GitHub drops most scheduled runs, so try four times; a once-per-day
    # guard in propose.js means only the first that fires produces a post.
    - cron: '7 16 * * *'
    - cron: '11 17 * * *'
    - cron: '19 18 * * *'
    - cron: '23 19 * * *'
  workflow_dispatch:

concurrency:
  group: hamster-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  propose:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HF_API_KEY_ID: ${{ secrets.HF_API_KEY_ID }}
      HF_API_KEY_SECRET: ${{ secrets.HF_API_KEY_SECRET }}
      GITHUB_BRANCH: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Anything tapped after last night's final check has been sitting in
      # Telegram's queue since. Act on it BEFORE proposing: an overnight OK
      # publishes now and today's episode follows in the same run, instead of
      # a "still waiting on you" reminder for a tap that was already made.
      # continue-on-error so a bad publish (token, Instagram outage) still
      # lets today's proposal go out; check.js has already sent the error to
      # Telegram, and the pending state is persisted by the step below.
      - name: Act on any answer from overnight
        continue-on-error: true
        run: node src/check.js

      - name: Generate episode and ask for approval
        run: node src/propose.js

      # if: always() matters. propose.js has already sent the proposal to
      # Telegram by this point and stamped lastProposedOn; if this step is
      # skipped the claim never reaches the remote and the next cron slot
      # generates and sends a SECOND proposal for the same day.
      - name: Persist the proposal
        if: always()
        run: .github/workflows/_persist.sh "Propose post $(date -u +%Y-%m-%d)"

      # The image is live on raw.githubusercontent.com now, so stay on the line
      # for an hour. Redraws and rewrites no longer end this step, and check.js
      # pushes each new image itself so an OK on it can succeed in the same
      # window. Actions minutes are free on a public repo, and the repo has to
      # be public for raw.githubusercontent.com to serve the image anyway.
      # The backup slots below re-enter this step too when something is still
      # awaiting, so the bot is effectively live most of the morning.
      - name: Listen for an answer
        run: node src/check.js --wait 60

      - name: Persist the result
        if: always()
        run: .github/workflows/_persist.sh "Update after approval check"

      - name: Alert if state could not be saved
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="The daily propose run failed. Check the Actions tab: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
