name: Check for approval

# Every 30 minutes from the proposal until late, covering both the US
# audience window and the Ulaanbaatar evening (13:15-23:45 UTC).
on:
  schedule:
    - cron: '15,45 13-23 * * *'
  workflow_dispatch:

concurrency:
  group: hamster-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_BRANCH: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Act on the latest Telegram answer
        run: node src/check.js

      # check.js may have already published to Instagram by this point, so
      # losing this push means the remote still says "awaiting" for a live
      # episode: tomorrow's run sends a reminder instead of a post, and
      # tapping OK again publishes a duplicate. _persist.sh retries.
      - name: Persist the outcome
        if: always()
        run: .github/workflows/_persist.sh "Handle approval decision"

      - name: Alert if state could not be saved
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="A check run failed and state may not have been saved. If a post went live, the repo may still say it is awaiting approval. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
