name: Check for approval

# Every 15 minutes from the proposal through the Pacific evening.
# 16:00-23:45 UTC is 9am-4:45pm in Monterey; 00:00-05:45 UTC covers the
# same evening, 5pm-10:45pm, since UTC has rolled over by then. Anything
# tapped after that is handled first thing by the next morning's propose run.
#
# Every 15 rather than 30 because GitHub delays and drops scheduled runs, and
# there is no webhook: between runs nobody is listening, so a tap just sits in
# Telegram's queue. More slots means a shorter worst case.
#
# While a propose run holds the concurrency group (its first hour), the checks
# queued behind it are cancelled by GitHub. That is expected and harmless:
# the propose run is already listening for presses.
on:
  schedule:
    - cron: '0,15,30,45 16-23 * * *'
    - cron: '0,15,30,45 0-5 * * *'
  workflow_dispatch:

concurrency:
  group: hamster-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HF_API_KEY_ID: ${{ secrets.HF_API_KEY_ID }}
      HF_API_KEY_SECRET: ${{ secrets.HF_API_KEY_SECRET }}
      GITHUB_BRANCH: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Act on the latest Telegram answer
        run: node src/check.js

      # Trend videos sent to the bot: analyse, paint, and (after a tap) remix.
      # continue-on-error so a remix problem never blocks saving the approval
      # state above; remix.js reports its own errors on Telegram.
      - name: Handle remix videos
        continue-on-error: true
        run: node src/remix.js

      # check.js may have already published to Instagram by this point, so
      # losing this push means the remote still says "awaiting" for a live
      # episode: tomorrow's run sends a reminder instead of a post, and
      # tapping OK again publishes a duplicate. _persist.sh retries.
      - name: Persist the outcome
        if: always()
        run: .github/workflows/_persist.sh "Handle approval decision"

      - name: Alert if state could not be saved
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="A check run failed and state may not have been saved. If a post went live, the repo may still say it is awaiting approval. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
