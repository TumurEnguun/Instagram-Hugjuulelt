name: Weekly insights

# Sunday evening in Ulaanbaatar (12:00 UTC = 20:00 local).
# Several slots because GitHub drops most scheduled runs; a once-per-day
# guard in insights.js means only the first that fires sends the report.
on:
  schedule:
    - cron: '3 12 * * 0'
    - cron: '9 13 * * 0'
    - cron: '17 14 * * 0'
  workflow_dispatch:

concurrency:
  group: hamster-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_BRANCH: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: node src/insights.js --send

      # runOncePerDay marks the day only after the send succeeds, so this
      # commit records a report that actually went out. A failed send leaves
      # the marker unwritten and the remaining Sunday slots free to retry.
      - name: Record that the report went out
        if: always()
        run: .github/workflows/_persist.sh "Weekly insights report sent"
